version: '3.8'

services:
  redis:
    image: redis:7.4-alpine
    container_name: bullmq-tui-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
